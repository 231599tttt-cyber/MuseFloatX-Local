name: Build Local APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android platform and build tools
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.7"

      - name: Install CMake and Ninja
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build binutils

      - name: Set up Android NDK r27c
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r27c
          add-to-path: true
          local-cache: true

      - name: Resolve NDK home
        run: |
          NDK_HOME="${ANDROID_NDK_HOME:-$ANDROID_NDK_ROOT}"
          if [ -z "$NDK_HOME" ]; then
            NDK_HOME="$(ls -d "$ANDROID_HOME"/ndk/* 2>/dev/null | sort -V | tail -1)"
          fi
          echo "NDK_HOME=$NDK_HOME"
          test -f "$NDK_HOME/build/cmake/android.toolchain.cmake"
          echo "NDK_HOME=$NDK_HOME" >> "$GITHUB_ENV"

      - name: Clone llama.cpp (latest, Qwen3.5 / Gated DeltaNet support)
        run: |
          git clone --depth 1 https://github.com/ggml-org/llama.cpp.git /tmp/llama.cpp
          ls /tmp/llama.cpp

      - name: Build llama-server for Android arm64-v8a and package as native library
        run: |
          cmake -S /tmp/llama.cpp -B /tmp/llama.cpp/build-android \
            -DCMAKE_TOOLCHAIN_FILE="$NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-26 \
            -DANDROID_STL=c++_static \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=OFF \
            -DLLAMA_BUILD_TESTS=OFF \
            -DLLAMA_BUILD_EXAMPLES=OFF \
            -DLLAMA_BUILD_SERVER=ON \
            -DLLAMA_CURL=OFF \
            -DGGML_METAL=OFF \
            -DGGML_CUDA=OFF \
            -DGGML_VULKAN=OFF \
            -DGGML_OPENCL=OFF
          cmake --build /tmp/llama.cpp/build-android --target llama-server -j"$(nproc)"
          # Reject the ~7KB dynamic stub: it needs libllama.so / libggml.so at
          # runtime, which a bare stub alone cannot satisfy on a phone.
          BIN="$(find /tmp/llama.cpp/build-android -maxdepth 3 -name llama-server -type f -size +1M | head -1)"
          echo "llama-server binary: $BIN"
          test -n "$BIN"
          ls -lh "$BIN"
          # Strip debug symbols: the static binary is ~194MB unstripped, which
          # would make the APK huge for no benefit. Stripping is safe for an
          # executable and does not change its DT_NEEDED entries.
          STRIP_BIN="$(find "$NDK_HOME" -name "llvm-strip" -type f 2>/dev/null | head -1)"
          if [ -n "$STRIP_BIN" ]; then
            "$STRIP_BIN" "$BIN" || echo "WARNING: llvm-strip failed, keeping unstripped binary"
            ls -lh "$BIN"
          else
            echo "WARNING: llvm-strip not found in NDK, keeping unstripped binary"
          fi
          echo "=== DT_NEEDED of llama-server ==="
          READELF="$(command -v llvm-readelf || command -v readelf)"
          "$READELF" -d "$BIN" | tee /tmp/dt_needed.txt || true
          # Package as a native library, NOT as an asset: Android Gradle only
          # puts files under jniLibs into APK lib/arm64-v8a/, and the system
          # extracts them to the app's nativeLibraryDir at install time, which
          # is executable. The old assets-copy-to-private-dir route hits the
          # Android 10+ W^X limit (Permission denied) and must not come back.
          mkdir -p app/src/main/jniLibs/arm64-v8a
          cp "$BIN" app/src/main/jniLibs/arm64-v8a/libllama_server.so
          # If the build did produce shared libs (e.g. a future llama.cpp
          # ignores BUILD_SHARED_LIBS), bundle every one of them next to it,
          # so LD_LIBRARY_PATH=nativeLibraryDir can find them at runtime.
          find /tmp/llama.cpp/build-android -name "*.so" -type f | while read -r SO; do
            cp "$SO" app/src/main/jniLibs/arm64-v8a/
          done
          # libomp.so is the exception that the step above cannot find: the
          # static llama-server still links the OpenMP runtime, and that
          # runtime lives in the NDK toolchain, not in the llama.cpp build
          # dir, and NOT in the Android system image. Without bundling it,
          # the phone would fail at startup with a missing-library error,
          # and the DT_NEEDED check below correctly fails the build.
          LIBOMP="$(find "$NDK_HOME" -name "libomp.so" -path "*aarch64*" 2>/dev/null | head -1)"
          if [ -z "$LIBOMP" ]; then
            LIBOMP="$(find "$NDK_HOME" -name "libomp.so" 2>/dev/null | head -1)"
          fi
          if [ -n "$LIBOMP" ]; then
            cp "$LIBOMP" app/src/main/jniLibs/arm64-v8a/
            echo "bundled libomp: $LIBOMP"
            ls -lh app/src/main/jniLibs/arm64-v8a/libomp.so
          else
            echo "WARNING: libomp.so not found anywhere in NDK, DT_NEEDED check below will fail if it is needed"
          fi
          # Every non-system DT_NEEDED entry must have a matching .so in jniLibs.
          # System libs provided by Android itself: libc, libm, libdl, liblog,
          # libandroid, libz. Anything else missing here = build failure, not a
          # silent broken APK.
          grep -o "NEEDED.*Shared library: \[.*\]" /tmp/dt_needed.txt | sed 's/.*\[//;s/\]//' > /tmp/needed.txt || true
          cat /tmp/needed.txt || true
          MISSING=0
          while read -r LIB; do
            [ -z "$LIB" ] && continue
            case "$LIB" in
              libc.so|libm.so|libdl.so|liblog.so|libandroid.so|libz.so) continue ;;
            esac
            if [ ! -f "app/src/main/jniLibs/arm64-v8a/$LIB" ]; then
              echo "ERROR: DT_NEEDED $LIB has no bundled .so in jniLibs/arm64-v8a/"
              MISSING=1
            fi
          done < /tmp/needed.txt
          [ "$MISSING" = "0" ]
          # Old route must be gone: no stale asset binary, no private-dir copy.
          rm -f app/src/main/assets/llama-server
          ls -lh app/src/main/jniLibs/arm64-v8a/
          file app/src/main/jniLibs/arm64-v8a/libllama_server.so || true

      - name: Build debug APK
        run: gradle :app:assembleDebug --console=plain --stacktrace

      - name: Verify APK contains the native llama-server (not a stub, no old route)
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          ls -lh "$APK"
          echo "=== lib entries in APK ==="
          unzip -l "$APK" | grep "lib/arm64-v8a/" || true
          # 1) libllama_server.so must exist in lib/arm64-v8a/
          unzip -l "$APK" | grep -q "lib/arm64-v8a/libllama_server.so" || { echo "ERROR: APK has no lib/arm64-v8a/libllama_server.so"; exit 1; }
          # 2) It must not be a ~7KB stub.
          mkdir -p /tmp/apkcheck && unzip -o -j "$APK" "lib/arm64-v8a/libllama_server.so" -d /tmp/apkcheck
          SIZE="$(stat -c%s /tmp/apkcheck/libllama_server.so)"
          echo "libllama_server.so size in APK: $SIZE bytes"
          [ "$SIZE" -gt 1048576 ] || { echo "ERROR: libllama_server.so is only $SIZE bytes, looks like a dynamic stub"; exit 1; }
          # 3) DT_NEEDED check on the packaged binary itself.
          READELF="$(command -v llvm-readelf || command -v readelf)"
          "$READELF" -d /tmp/apkcheck/libllama_server.so | tee /tmp/apk_dt.txt || true
          grep -o "NEEDED.*Shared library: \[.*\]" /tmp/apk_dt.txt | sed 's/.*\[//;s/\]//' > /tmp/apk_needed.txt || true
          while read -r LIB; do
            [ -z "$LIB" ] && continue
            case "$LIB" in
              libc.so|libm.so|libdl.so|liblog.so|libandroid.so|libz.so) continue ;;
            esac
            unzip -l "$APK" | grep -q "lib/arm64-v8a/$LIB" || { echo "ERROR: APK libllama_server.so needs $LIB but APK does not bundle it"; exit 1; }
          done < /tmp/apk_needed.txt
          # 4) Old private-dir execution route must not be in the code.
          if grep -rn "filesDir/bin\|bin/llama-server" app/src/main/java/ ; then
            echo "ERROR: old private-dir execution path is still in the code"
            exit 1
          fi
          # 5) Explicit legacy-packaging settings must be present: without them
          # targetSdk 34 may not extract the native lib to nativeLibraryDir at
          # all, and the whole native-library fix would silently do nothing.
          grep -q "useLegacyPackaging = true" app/build.gradle.kts || { echo "ERROR: app/build.gradle.kts is missing jniLibs.useLegacyPackaging = true"; exit 1; }
          grep -q 'android:extractNativeLibs="true"' app/src/main/AndroidManifest.xml || { echo "ERROR: AndroidManifest.xml is missing android:extractNativeLibs=true"; exit 1; }
          if grep -q "assets" app/src/main/java/com/example/musefloatx/LocalServer.kt; then
            echo "ERROR: LocalServer.kt still references assets"
            exit 1
          fi
          echo "APK verification passed"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MuseFloatX-Local-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload native llama-server (for debugging)
        uses: actions/upload-artifact@v4
        with:
          name: llama-server-arm64
          path: app/src/main/jniLibs/arm64-v8a/libllama_server.so
          if-no-files-found: warn
